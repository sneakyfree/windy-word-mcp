name: canonical-domains-lint
on:
  push:
    branches: [main, master, windy-main]
  pull_request:
jobs:
  lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: runner-lint (hosted runners are billing-locked)
        run: bash "$GITHUB_WORKSPACE/.github/lint/lint-runner-labels.sh" "$GITHUB_WORKSPACE/.github/workflows"
      - name: Run canonical-domains lint
        run: bash .github/lint/lint-canonical-domains.sh --config .github/lint/canonical-domains.json .
