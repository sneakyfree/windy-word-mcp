name: contract-test
on:
  push:
    branches: [main, master, windy-main]
  pull_request:
jobs:
  contract:
    # Fork PRs never reach the self-hosted runner (Veron): this is a public repo (Boss-ruled runner guard, 10-01).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Enumerate tools (smoke)
        run: npm run test:list-tools
      - name: Contract test — tools enumerate + schemas compile
        run: npm run test:contract
