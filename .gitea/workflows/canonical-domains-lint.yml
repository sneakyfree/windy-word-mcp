name: canonical-domains-lint
# Runs on the forge (Windy Git; its bridge posts windy-git/<workflow>/<job> to GitHub) since the
# GitHub runner on Veron went (Boss RULING 2026-11-22T18:01:52Z). Same-repo PRs only.
on:
  push:
    branches: [main, master, windy-main]
  pull_request:
jobs:
  lint:
    # Fork PRs never reach the self-hosted runner (Veron): this is a public repo (Boss-ruled runner guard, 10-01).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: runner-lint (hosted runners are billing-locked)
        run: bash "$GITHUB_WORKSPACE/.github/lint/lint-runner-labels.sh" "$GITHUB_WORKSPACE/.gitea/workflows"
      - name: Run canonical-domains lint
        run: bash .github/lint/lint-canonical-domains.sh --config .github/lint/canonical-domains.json .
